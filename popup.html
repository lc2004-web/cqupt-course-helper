<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CQUPT 选课辅助器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="header-mascot" src="header-mascot.png" alt="">
    <div class="brand">CQUPT 选课辅助器</div>
  </header>

  <main>
    <section id="loginCard" class="login-card">
      <div class="login-heading">
        <strong>统一认证登录</strong>
        <span>一键直达研究生在线</span>
      </div>
      <label class="login-field"><span>学号</span><input id="studentId" type="text" inputmode="numeric" autocomplete="username" placeholder="统一认证码"></label>
      <label class="login-field">
        <span>密码</span>
        <span class="password-control">
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="统一认证密码">
          <button id="toggleLoginPassword" class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 12s3.6-6 9.8-6 9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z"></path><circle cx="12" cy="12" r="2.8"></circle></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A9.9 9.9 0 0 1 12 6c6.2 0 9.8 6 9.8 6a15 15 0 0 1-2.2 2.8M6.2 6.3C3.6 8.1 2.2 12 2.2 12s3.6 6 9.8 6a9.7 9.7 0 0 0 3.3-.6M9.9 9.8a3 3 0 0 0 4.2 4.3"></path></svg>
          </button>
        </span>
      </label>
      <div class="login-options">
        <label><input id="rememberCredentials" type="checkbox"> 记住账密</label>
        <label><input id="schoolRememberMe" type="checkbox"> 学校7天免登录</label>
      </div>
      <button id="oneClickLogin" class="login-button">一键登录研究生在线</button>
      <div id="loginStatus" class="login-status">请输入统一认证码和密码。</div>
    </section>

    <div id="courseWorkspace" hidden>
    <section class="guide-card">
      <div>
        <strong>快捷导入</strong>
        <p>先去培养方案勾选需要的课程。</p>
      </div>
      <button id="planGuide" class="guide">打开/读取培养方案</button>
    </section>

    <div class="quick-nav">
      <button id="openPlan" class="nav-button">打开培养方案</button>
    </div>

    <label class="field-label" for="targets">目标课程编号</label>
    <textarea id="targets" spellcheck="false" placeholder="每行一个准确课程编号，例如：&#10;M0130005&#10;M0150023"></textarea>

    <section id="autoAssignedNotice" class="auto-assigned-notice" hidden>
      <strong>已跳过学校统一分班课程</strong>
      <p id="autoAssignedNoticeText"></p>
    </section>

    <section id="preferenceCard" class="preference-card" hidden>
      <div class="preference-heading">
        <strong>教师与班级偏好</strong>
        <span id="preferenceSummary"></span>
      </div>
      <p>优先选择已设置的教学班；偏好班不可用时，自动选择其他可用班。</p>
      <div id="preferenceRows" class="preference-rows"></div>
    </section>

    <section class="card">
      <label class="toggle"><input type="checkbox" id="autoRefresh"><span>低频自动刷新</span></label>
      <label class="number-row"><span>刷新间隔</span><input type="number" id="refreshSeconds" min="1" max="600"><span>秒</span></label>
      <div class="mode-note">发现目标后自动选班：优先选择偏好班；未设置或偏好班不可用时选择其他可用班。</div>
    </section>

    <div class="actions">
      <button id="goCourse" class="secondary">去选课</button>
      <button id="startListen" class="primary">开始监听</button>
    </div>

    <section id="creditComparison" class="credit-comparison" hidden>
      <div class="credit-heading">
        <strong>培养方案学分核对</strong>
        <span id="creditOverall"></span>
      </div>
      <div id="creditComparisonRows" class="credit-rows"></div>
      <p id="creditComparisonNote" class="credit-note"></p>
    </section>

    <section id="importSuccess" class="success-dialog" hidden>
      <strong>✓ 导入成功</strong>
      <p id="importSuccessText"></p>
      <button id="dismissImportSuccess" type="button">设置教师/班级偏好</button>
    </section>

    <div id="status" class="status">正在读取状态…</div>
    <details class="diagnostics">
      <summary>导入诊断信息</summary>
      <pre id="diagnosticOutput">尚未执行检测。</pre>
    </details>
    <p class="footnote">先点“去选课”进入选课管理，再在即将开放时点“开始监听”。</p>
    <div class="auth-toolbar">
      <span>已登录研究生在线</span>
      <button id="logout" type="button">退出登录</button>
    </div>
    </div>
    <footer class="author-footer">作者邮箱：2741893758@qq.com，如有问题请反馈</footer>
  </main>
  <script src="course-policy.js"></script>
  <script src="popup.js"></script>
</body>
</html>
